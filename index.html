<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111214"><title>善班向前 · 輸入密碼</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:30px;background:#111214;color:#f2f0e9;font-family:'PingFang TC','Helvetica Neue',sans-serif;overflow:hidden}body:before{content:'';position:fixed;inset:-30%;z-index:-1;background:linear-gradient(115deg,transparent 40%,#d2e8940b 48%,transparent 52%),linear-gradient(68deg,transparent 44%,#ff69450c 51%,transparent 55%)}.edge{position:fixed;right:-90px;bottom:5%;font:900 min(42vw,390px) Impact,sans-serif;color:#ffffff03;transform:rotate(-12deg);pointer-events:none;letter-spacing:-15px}main{width:min(390px,100%)}.eyebrow{font:10px monospace;letter-spacing:3px;color:#e7ef92;margin-bottom:20px;display:flex;align-items:center;gap:10px}.eyebrow:before{content:'↗';display:inline-grid;place-items:center;background:#ff6945;color:#111;width:25px;height:25px;font-size:20px}h1{font-weight:900;font-size:67px;line-height:1.1;letter-spacing:-3px;margin:0 0 22px}h1 span{display:block;color:#ff6945}.intro{font-size:12px;line-height:2;letter-spacing:2px;color:#92958e;margin-bottom:34px}.field{display:flex;border:1px solid #ffffff32;background:#ffffff03}input{flex:1;min-width:0;padding:16px;color:#f2f0e9;font-size:15px;background:none;border:0;outline:none}input:focus{box-shadow:inset 0 0 0 1px #e7ef92}button{font:inherit;cursor:pointer}#show{background:none;border:0;color:#8e9187;font-size:11px;padding:10px}#unlock{display:block;width:100%;margin-top:13px;padding:16px;background:#e7ef92;color:#141614;border:0;letter-spacing:4px;font-size:13px;font-weight:700}#unlock:disabled{opacity:.55;cursor:wait}#message{height:35px;color:#ff8566;font-size:12px;line-height:1.7;letter-spacing:1px}.note{margin:17px 0 0;padding-top:22px;border-top:1px solid #ffffff15;font-size:9px;color:#74786f;letter-spacing:2px}.notes{display:flex;justify-content:space-between}button:focus-visible{outline:2px solid #ff6945;outline-offset:4px}@media(max-width:450px){h1{font-size:57px}}</style></head><body><div class="edge" aria-hidden="true">ROCK</div><main><p class="eyebrow">CLASS ANTHEM / 01</p><h1>善班<span>向前 ↗</span></h1><p class="intro">38 個名字，同一首歌。<br>輸入密碼，把青春的音量調大。</p><form id="gate"><div class="field"><input id="password" type="password" aria-label="訪問密碼" placeholder="請輸入訪問密碼" autocomplete="off" required><button type="button" id="show" aria-label="顯示密碼">顯示</button></div><button id="unlock" type="submit">進 入 舞 台</button><p id="message" role="status" aria-live="polite"></p></form><div class="notes note"><span>CAMPUS ROCK</span><span>音樂與歌詞 · 加密開啟</span></div></main><script>
const field=document.getElementById('password'),button=document.getElementById('unlock'),message=document.getElementById('message');let payload;
document.getElementById('show').onclick=()=>{let visible=field.type==='password';field.type=visible?'text':'password';document.getElementById('show').textContent=visible?'隱藏':'顯示';document.getElementById('show').setAttribute('aria-label',visible?'隱藏密碼':'顯示密碼')};
document.getElementById('gate').onsubmit=async e=>{e.preventDefault();if(!field.value)return;button.disabled=true;button.textContent='正在開啟…';message.textContent='';try{if(!crypto.subtle)throw new Error('unsupported');if(!payload){const response=await fetch('payload.bin',{cache:'no-store'});if(!response.ok)throw new Error('network');payload=new Uint8Array(await response.arrayBuffer())}const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:payload.slice(0,16),iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:payload.slice(16,28)},key,payload.slice(28));field.value='';const html=new TextDecoder().decode(plain);document.open();document.write(html);document.close()}catch(error){message.textContent=error.message==='network'?'音訊暫時未能載入，請稍後再試。':error.message==='unsupported'?'請使用新版 Chrome、Safari 或 Edge 開啟。':'密碼不正確，請重新輸入。';button.disabled=false;button.textContent='進 入 舞 台';field.focus()}};
</script></body></html>
